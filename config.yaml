
project:
  name: pneumonia-detection
  seed: 42

data:
  raw_dir: data/raw/chest_xray
  processed_dir: data/processed
  image_size: 224
  batch_size: 32

training:
  epochs: 20
  learning_rate: 0.001
  num_workers: 2

model:
  architecture: resnet18
  pretrained: true
  num_classes: 2

evaluation:
  metrics:
    - accuracy
    - precision
    - recall
    - f1_score
    - roc_auc
